    @if (ticket(); as t) {
      <section class="ticket">
        <header>
          <h1>{{ t.movieTitle }}</h1>
          <p class="reservation-id">Reserva {{ t.reservationId }}</p>
        </header>

        <dl>
          <div class="row">
            <dt>Sala</dt>
            <dd>{{ t.roomName }}</dd>
          </div>
          <div class="row">
            <dt>Función</dt>
            <dd>{{ showtime() }}</dd>
          </div>
          <div class="row">
            <dt>Asientos</dt>
            <dd>
              @for (seat of t.seatLabels; track seat) {
                <span class="seat">{{ seat }}</span>
              }
            </dd>
          </div>
        </dl>

        <app-qr-code [payload]="t.qrPayload" />
        <p class="synthetic-note">Ticket de prueba: no es válido para ingresar.</p>
      </section>
    } @else {
      <p class="loading">Cargando ticket…</p>
    }
