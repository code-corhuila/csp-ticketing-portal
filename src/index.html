<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ticket portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    Standalone development only. Mirror of the design tokens owned by the
    shell (csp-front/src/styles.css; defined in csp-docs/12-ux-ui/
    design-system.md, HU-UI-001). Inside the shell this page is never
    loaded — the shell defines the tokens and portals never redefine them.
  -->
  <style>
    :root {
      --color-brand-primary: #8B5CF6;
      --color-brand-primary-hover: #A78BFA;
      --color-brand-secondary: #38BDF8;
      --color-brand-secondary-hover: #7DD3FC;

      --color-bg-primary: #0B0D17;
      --color-bg-surface: #13172A;
      --color-bg-surface-hover: #1E293B;
      --color-border: #1E293B;
      --color-border-glow: rgba(139, 92, 246, 0.4);

      --color-text-primary: #F1F5F9;
      --color-text-secondary: #94A3B8;
      --color-text-muted: #64748B;

      --seat-available: #1E293B;
      --seat-selected: #10B981;
      --seat-held: #F59E0B;
      --seat-occupied: #0F172A;
      --color-error: #EF4444;

      --font-family-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.25rem;
      --font-size-xl: 1.563rem;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      font-family: var(--font-family-sans);
      line-height: 1.5;
    }
  </style>
</head>
<body><app-root></app-root></body>
