version: '3.8'

services:
  ticketing:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: csp-ticketing-portal:local
    container_name: csp-ticketing-portal
    ports:
      - "4205:4205"
    environment:
      - CORS_ALLOWED_ORIGIN_REGEX=^http://localhost:420[0-5]$
    networks:
      - csp-frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4205/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  csp-frontend:
    external: true
    name: csp-frontend