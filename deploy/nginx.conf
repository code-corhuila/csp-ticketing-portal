# csp-ticketing-portal nginx configuration
# Serves the Angular build; CORS for shell (4200) loading portal (4205)

server {
    listen 4205;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Federated modules and fonts need CORS when loaded by the shell.
    location ~* \.(js|css|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /opt/csp-runtime/cors-origin.conf;
        try_files $uri =404;
    }

    # Other static assets do not need cross-origin access.
    location ~* \.(png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Remote entry point - no cache, CORS headers from included template
    location = /remoteEntry.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        include /opt/csp-runtime/cors-origin.conf;
    }

    # Main Angular app - fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location = /health {
        access_log off;
        if (!-f /usr/share/nginx/html/index.html) {
            return 500;
        }
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}